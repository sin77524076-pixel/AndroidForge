
name: Build MYTH Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build MYTH
        shell: bash
        run: |
          PROJECT_DIR=$(find "$GITHUB_WORKSPACE" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            ZIP_FILE=$(find "$GITHUB_WORKSPACE" -type f -name 'MYTH-Android-Assistant-Plus.zip' -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: MYTH project files or ZIP not found."
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/myth-source"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/myth-source"
            PROJECT_DIR=$(find "$RUNNER_TEMP/myth-source" -type f -name settings.gradle.kts -print -quit | xargs -r dirname)
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found."
            exit 1
          fi

          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/MYTH-debug.apk"

      - name: Upload MYTH APK
        uses: actions/upload-artifact@v4
        with:
          name: MYTH-Android-APK
          path: MYTH-debug.apk
